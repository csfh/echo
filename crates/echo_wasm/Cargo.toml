[package]
name = "echo_wasm"
version = "0.0.1"
edition = "2024"
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
echo_ast = { path = "../echo_ast" }
echo_diagnostics = { path = "../echo_diagnostics" }
echo_hir = { path = "../echo_hir" }
echo_mir = { path = "../echo_mir" }
echo_parser = { path = "../echo_parser" }
echo_resolver = { path = "../echo_resolver" }
echo_runtime = { path = "../echo_runtime", default-features = false }
echo_semantics = { path = "../echo_semantics" }
echo_source = { path = "../echo_source" }
echo_std = { path = "../echo_std", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
echo_runtime = { path = "../echo_runtime", features = ["host-io"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.126"
