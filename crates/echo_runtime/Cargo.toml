[package]
name = "echo_runtime"
version = "0.0.1"
edition = "2024"
license.workspace = true
publish = false

[lib]
crate-type = ["rlib", "staticlib"]

[features]
default = ["host-io"]
# Native xo / JIT. Off for the wasm playground host (no mio/rustls/getrandom).
host-io = [
    "dep:aes-gcm",
    "dep:base64",
    "dep:chrono",
    "dep:flate2",
    "dep:getrandom",
    "dep:hex",
    "dep:hmac",
    "dep:mio",
    "dep:rustls",
    "dep:rustls-native-certs",
    "dep:rustls-pemfile",
    "dep:webpki-roots",
    "dep:serde_json",
    "dep:sha2",
    "dep:zip",
    "dep:gix-pack",
    "dep:gix-hash",
]

[dependencies]
aes-gcm = { version = "0.10", optional = true }
base64 = { version = "0.22", optional = true }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"], optional = true }
flate2 = { version = "1", optional = true }
getrandom = { version = "0.2", optional = true }
hex = { version = "0.4", optional = true }
hmac = { version = "0.12", optional = true }
httparse = "1"
mio = { version = "1", features = ["os-poll", "os-ext", "net"], optional = true }
rustls = { version = "0.23", features = ["ring"], optional = true }
rustls-native-certs = { version = "0.8", optional = true }
rustls-pemfile = { version = "2", optional = true }
webpki-roots = { version = "0.26", optional = true }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }
zip = { version = "2", default-features = false, features = ["deflate"], optional = true }
gix-hash = { version = "0.16", optional = true }
gix-pack = { version = "0.57", default-features = false, features = ["streaming-input"], optional = true }
